# Redirección automática de HTTP (80) a HTTPS (443) con código 301 Permanent Redirect
server {
    listen 80;
    server_name nimbus-alpha.net nimbus-internal.net;
    return 301 https://$host$request_uri;
}

# Servidor HTTPS con terminación TLS
server {
    listen 443 ssl;
    server_name nimbus-alpha.net nimbus-internal.net;

    ssl_certificate /etc/nginx/ssl/nimbus.crt;
    ssl_certificate_key /etc/nginx/ssl/nimbus.key;

    # Protocolos seguros permitidos
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Cabeceras de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        # Aplicar Rate Limiting definido en el contexto http
        limit_req zone=nimbus_limit burst=4 nodelay;

        # Reenviar tráfico a Apache y preservar la cabecera Host original
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
