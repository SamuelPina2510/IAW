<VirtualHost *:8080>
    ServerName nimbus-internal.net
    DocumentRoot /var/www/internal
    
    <Directory /var/www/internal>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Bloqueo estricto del fichero sensible simulado
    <Files "secret-keys.json">
        Require all denied
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/internal_error.log
    CustomLog ${APACHE_LOG_DIR}/internal_access.log combined
</VirtualHost>
