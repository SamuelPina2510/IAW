<VirtualHost *:8080>
    ServerName nimbus-default.net
    DocumentRoot /var/www/default
    <Directory /var/www/default>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/default_error.log
    CustomLog ${APACHE_LOG_DIR}/default_access.log combined
</VirtualHost>
