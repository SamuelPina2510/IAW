<VirtualHost *:8080>
    ServerName nimbus-alpha.net
    DocumentRoot /var/www/alpha
    <Directory /var/www/alpha>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/alpha_error.log
    CustomLog ${APACHE_LOG_DIR}/alpha_access.log combined
</VirtualHost>
